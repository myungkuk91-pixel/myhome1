<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background with Gradient -->
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Glowing Background Circle -->
  <circle cx="200" cy="200" r="180" fill="url(#bg-glow)"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#06B6D4" stroke-width="1" stroke-dasharray="8 4" opacity="0.3"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="150 100" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer Tech Lines -->
  <path d="M 90 200 A 110 110 0 0 1 310 200" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.5" stroke-dasharray="40 180"/>

  <!-- Character Silhouette / Smart Abstract Icon -->
  <g transform="translate(0, 10)">
    <!-- Shoulders / Suit -->
    <path d="M 110 320 C 110 270, 140 250, 200 250 C 260 250, 290 270, 290 320 Z" fill="url(#suit-grad)" stroke="#1E293B" stroke-width="2"/>
    <path d="M 150 255 L 200 300 L 250 255" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.8"/>
    <!-- Tie / Neon Accent -->
    <path d="M 195 258 L 205 258 L 208 290 L 200 300 L 192 290 Z" fill="#10B981" opacity="0.9"/>
    
    <!-- Head / Face -->
    <circle cx="200" cy="170" r="50" fill="#1E293B" stroke="url(#avatar-grad)" stroke-width="4"/>
    
    <!-- Glasses (Smart / Professional vibe) -->
    <path d="M 175 165 H 190 M 210 165 H 225 M 190 165 H 210" fill="none" stroke="#06B6D4" stroke-width="3" stroke-linecap="round"/>
    <rect x="173" y="157" width="20" height="15" rx="3" fill="none" stroke="#06B6D4" stroke-width="2.5" opacity="0.9"/>
    <rect x="207" y="157" width="20" height="15" rx="3" fill="none" stroke="#06B6D4" stroke-width="2.5" opacity="0.9"/>

    <!-- Hair / Sleek Cut -->
    <path d="M 150 170 C 150 120, 250 120, 250 170 C 250 155, 235 135, 200 135 C 165 135, 150 155, 150 170 Z" fill="url(#avatar-grad)"/>

    <!-- Gear / QC Icon floating on the side -->
    <g transform="translate(290, 130) scale(0.8)">
      <circle cx="20" cy="20" r="12" fill="none" stroke="#10B981" stroke-width="3"/>
      <path d="M 20 2 L 20 8 M 20 32 L 20 38 M 2 20 L 8 20 M 32 20 L 38 20 M 7 7 L 12 12 M 28 28 L 33 33 M 7 33 L 12 28 M 28 7 L 33 12" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- Checkmark / Quality Approved Icon floating on the other side -->
    <g transform="translate(80, 140) scale(0.7)">
      <circle cx="20" cy="20" r="16" fill="#06B6D4" fill-opacity="0.1" stroke="#06B6D4" stroke-width="2"/>
      <path d="M 12 20 L 18 26 L 28 14" fill="none" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
